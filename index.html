<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f1923">
<meta name="application-name" content="運転日報">
<title>🚛 運転日報</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f5f5}
#appFrame{border:0;width:100%;height:100%;display:block;background:#f5f5f5}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f5f5f5;color:#666;font-family:sans-serif;font-size:14px;z-index:9}
#boot.error{padding:24px;text-align:center;line-height:1.8;color:#e74c3c}
</style>
</head>
<body>
<div id="boot">🚛 本番版を読み込み中...</div>
<iframe id="appFrame" title="運転日報"></iframe>

<script>
(function(){
  'use strict';

  var CORE_URL='https://raw.githubusercontent.com/majiadokoreya-tech/truck-log/b2eb76256771bccbcc973e070cd853c9883755c3/index.html';
  var CACHE_KEY='trucklog_PROD_core_v7_20260831_table_ref';
  var frame=document.getElementById('appFrame');
  var boot=document.getElementById('boot');



  function fixLongDistanceAutoTimeCompletion(d,w){
    if(!d||!w)return;

    function patchTimeDone(){
      if(typeof w.isTimeInputDone!=='function')return;
      if(w.__longDistanceTimeDonePatched)return;
      w.__longDistanceTimeDonePatched=true;

      var original=w.isTimeInputDone;
      w.isTimeInputDone=function(){
        try{
          var jobs=Array.isArray(w.selectedJobs)?w.selectedJobs:[];
          if(jobs.includes('休み'))return true;

          var startEl=d.getElementById('startTime');
          var endEl=d.getElementById('endTime');
          var hasStart=!!(startEl&&startEl.value);
          var hasEnd=!!(endEl&&endEl.value);

          if(jobs.includes('長距離')){
            return hasStart&&hasEnd;
          }

          return original.apply(w,arguments);
        }catch(e){
          return original.apply(w,arguments);
        }
      };
    }

    function patchMissingFields(){
      if(typeof w.getMissingFieldsForRecord!=='function')return;
      if(w.__longDistanceMissingFieldsPatched)return;
      w.__longDistanceMissingFieldsPatched=true;

      var original=w.getMissingFieldsForRecord;
      w.getMissingFieldsForRecord=function(r){
        var missing=original.call(w,r);
        if(!r)return missing;

        var jobs=r.jobs||[];
        if(jobs.includes('長距離')&&r.startTime&&r.endTime){
          missing=missing.filter(function(x){
            return x!=='出勤時間'&&x!=='退勤時間';
          });
          if(r.overtimeConfirmed!==true&&!missing.includes('残業時間')){
            missing.push('残業時間');
          }
        }
        return missing;
      };
    }

    function patchFareSelect(){
      if(typeof w.selectFare!=='function')return;
      if(w.__longDistanceFareSelectPatched)return;
      w.__longDistanceFareSelectPatched=true;

      var original=w.selectFare;
      w.selectFare=function(){
        var result=original.apply(w,arguments);

        setTimeout(function(){
          try{
            var start=d.getElementById('startTime');
            var end=d.getElementById('endTime');

            if(start&&end&&start.value&&end.value){
              if(typeof w.updateInputProgress==='function')w.updateInputProgress();
              if(typeof w.renderInputSummary==='function')w.renderInputSummary();
            }
          }catch(e){}
        },0);

        return result;
      };
    }

    patchTimeDone();
    patchMissingFields();
    patchFareSelect();
  }

  function customizeMemoButtons(d,w){
    if(!d||!w)return;

    var memoArea=d.querySelector('#inputJobAccordion .memo-btn');
    if(!memoArea)return;

    var wrap=memoArea.parentElement;
    if(!wrap||wrap.dataset.customizedMemoButtons==='1')return;
    wrap.dataset.customizedMemoButtons='1';

    function findButtonByText(txt){
      return Array.prototype.find.call(wrap.querySelectorAll('.memo-btn'),function(el){
        return el.textContent.trim().indexOf(txt)>=0;
      });
    }

    var gas=findButtonByText('ガス');
    var ester=findButtonByText('エステル');
    var chlorine=findButtonByText('塩素');
    var load=findButtonByText('搭載');
    var chlorineOnly=findButtonByText('塩素搭載のみ');
    var chlorineDelivery=findButtonByText('塩素搭載＋配送');
    var environment=findButtonByText('環境整備');
    var kaneka=findButtonByText('カネカ');
    var pm=findButtonByText('PM搭載');
    var customer=findButtonByText('客先');

    if(chlorine)chlorine.remove();
    if(load)load.remove();

    if(ester){
      ester.innerHTML='🧪 エステル搭載';
      ester.onclick=function(){
        w.addMemo('エステル');
        w.addMemo('搭載');
        if(typeof w.updateInputProgress==='function')w.updateInputProgress();
      };
    }

    if(chlorineOnly){
      chlorineOnly.innerHTML='⚗️ 塩素搭載';
    }

    if(environment){
      environment.innerHTML='🧹 環境整備';
    }

    var ordered=[gas,ester,chlorineOnly,chlorineDelivery,environment,pm,kaneka,customer].filter(Boolean);
    ordered.forEach(function(el){wrap.appendChild(el);});
  }

  function injectReferenceUI(d){
    if(!d || d.getElementById('overtimeReferenceBtn'))return;

    var style=d.createElement('style');
    style.textContent=
      '.ot-ref-btn{width:100%;background:rgba(52,152,219,.12);border:1.5px solid var(--blue);border-radius:10px;padding:11px 12px;color:var(--blue);font-size:14px;font-weight:700;cursor:pointer;margin-top:8px}'+
      '.ot-ref-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:2200;align-items:flex-end;justify-content:center}'+
      '.ot-ref-overlay.open{display:flex}'+
      '.ot-ref-modal{background:var(--surface);width:100%;height:94vh;border-radius:18px 18px 0 0;overflow:hidden;display:flex;flex-direction:column;border-top:2px solid var(--blue)}'+
      '.ot-ref-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);flex:none}'+
      '.ot-ref-head-title{font-weight:700;color:var(--blue);font-size:16px}'+
      '.ot-ref-close{border:0;background:var(--surface2);border-radius:9px;padding:8px 12px;font-size:16px;color:var(--text)}'+
      '.ot-ref-body{padding:12px;overflow:auto;-webkit-overflow-scrolling:touch}'+
      '.ot-ref-note{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:10px}'+
      '.ot-ref-group{margin-bottom:18px}'+
      '.ot-ref-group-title{font-size:13px;font-weight:700;margin-bottom:7px;color:var(--text)}'+
      '.ot-ref-scroll{overflow:auto;border:1px solid var(--border);border-radius:10px;background:#fff}'+
      '.ot-ref-table{border-collapse:collapse;min-width:760px;width:max-content;font-size:10px;color:#111;background:#fff}'+
      '.ot-ref-table th,.ot-ref-table td{border:1px solid #aaa;padding:4px 5px;text-align:center;white-space:nowrap}'+
      '.ot-ref-table thead th{background:#f1f3f5;font-weight:700}'+
      '.ot-ref-table .start{position:sticky;left:0;background:#fff;font-weight:700;z-index:1}'+
      '.ot-ref-table .break{background:#fff3cd}'+
      '.ot-ref-legend{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.5}';
    d.head.appendChild(style);

    var otCard=d.querySelector('.time-card-ot');
    if(!otCard)return;

    var btn=d.createElement('button');
    btn.type='button';
    btn.id='overtimeReferenceBtn';
    btn.className='ot-ref-btn';
    btn.textContent='📋 会社の時間外早見表を見る';

    var note=d.getElementById('overtimeModeNote');
    otCard.insertBefore(btn,note||null);

    var overlay=d.createElement('div');
    overlay.id='overtimeReferenceOverlay';
    overlay.className='ot-ref-overlay';
    overlay.innerHTML=
      '<div class="ot-ref-modal" onclick="event.stopPropagation()">'+
        '<div class="ot-ref-head">'+
          '<div class="ot-ref-head-title">📋 会社公式 時間外早見表</div>'+
          '<button type="button" class="ot-ref-close" id="overtimeReferenceClose">✕ 閉じる</button>'+
        '</div>'+
        '<div class="ot-ref-body">'+
          '<div class="ot-ref-note">会社資料の4区分をスマホで見やすい表にしています。横にスクロールできます。</div>'+
          '<div id="overtimeReferenceTables"></div>'+
        '</div>'+
      '</div>';
    d.body.appendChild(overlay);

    function mins(v){
      var p=v.split(':');
      return parseInt(p[0],10)*60+parseInt(p[1],10);
    }

    function fmt(m){
      m=(m+1440)%1440;
      return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
    }

    function otHours(start,baseStart,stdEnd,end){
      var s=mins(start),b=mins(baseStart),std=mins(stdEnd),e=mins(end);
      if(e<s)e+=1440;
      var early=Math.max(0,b-s);
      var post=Math.max(0,e-std);
      early=Math.floor(early/15)*15;
      post=Math.floor(post/15)*15;
      var credited=post;
      if(post>240&&post<=270)credited=240;
      else if(post>270)credited=post-30;
      return Math.max(0,Math.round(((early+credited)/60)*4)/4);
    }

    function num(v){
      return v%1===0?String(v):String(v.toFixed(2)).replace(/0+$/,'').replace(/\.$/,'');
    }

    function buildGroup(title,starts,baseStart,stdEnd,endStart,endFinish){
      var ends=[];
      var m=mins(endStart);
      var last=mins(endFinish);
      if(last<m)last+=1440;
      for(;m<=last;m+=15)ends.push(fmt(m));

      var html='<div class="ot-ref-group"><div class="ot-ref-group-title">'+title+
        ' 【定時の退勤時間は'+stdEnd+'】</div><div class="ot-ref-scroll">'+
        '<table class="ot-ref-table"><thead><tr><th class="start">出勤\\退勤</th>';

      ends.forEach(function(e){html+='<th>'+e+'</th>'});
      html+='</tr></thead><tbody>';

      starts.forEach(function(s){
        html+='<tr><th class="start">'+s+'</th>';
        ends.forEach(function(e){
          var endM=mins(e);
          var stdM=mins(stdEnd);
          if(endM<mins(s))endM+=1440;
          var post=Math.max(0,endM-stdM);
          var cls=(post>240&&post<=270)?'break':'';
          html+='<td class="'+cls+'">'+num(otHours(s,baseStart,stdEnd,e))+'</td>';
        });
        html+='</tr>';
      });

      html+='</tbody></table></div>'+
        '<div class="ot-ref-legend">黄色：定時後4時間を超えた30分休憩帯。早出は定時後4時間の休憩判定には含めません。</div>'+
        '</div>';
      return html;
    }

    var html='';
    html+=buildGroup('4:30〜6:00出勤の時間外早見表',['4:30','5:00','5:30','6:00'],'6:00','14:15','14:15','21:00');
    html+=buildGroup('7:00〜8:00出勤の時間外早見表',['7:00','7:30','8:00'],'8:00','16:15','16:15','23:00');
    html+=buildGroup('9:00〜10:00出勤の時間外早見表',['9:00','10:00'],'10:00','18:15','18:15','01:00');
    html+=buildGroup('12:00〜13:00出勤の時間外早見表',['12:00','13:00'],'13:00','21:15','21:15','04:00');
    d.getElementById('overtimeReferenceTables').innerHTML=html;

    function openRef(){
      overlay.classList.add('open');
      d.body.style.overflow='hidden';
    }

    function closeRef(){
      overlay.classList.remove('open');
      d.body.style.overflow='';
    }

    btn.addEventListener('click',openRef);
    d.getElementById('overtimeReferenceClose').addEventListener('click',closeRef);
    overlay.addEventListener('click',function(e){
      if(e.target===overlay)closeRef();
    });
  }

  function renderCore(source){
    if(!source || source.indexOf('<!DOCTYPE html>')===-1 || source.indexOf('</html>')===-1){
      throw new Error('本番コードが不完全です');
    }

    frame.onload=function(){
      try{
        customizeMemoButtons(frame.contentDocument,frame.contentWindow);
        fixLongDistanceAutoTimeCompletion(frame.contentDocument,frame.contentWindow);
        injectReferenceUI(frame.contentDocument);
        boot.style.display='none';
      }catch(e){
        console.error(e);
        boot.className='error';
        boot.textContent='本番画面の追加表示に失敗しました。再読み込みしてください。';
      }
    };

    frame.srcdoc=source;
  }

  function load(){
    fetch(CORE_URL,{cache:'no-store'})
      .then(function(res){
        if(!res.ok)throw new Error('HTTP '+res.status);
        return res.text();
      })
      .then(function(source){
        if(source.indexOf('<!DOCTYPE html>')===-1 || source.indexOf('</html>')===-1){
          throw new Error('取得したindex.htmlが不完全です');
        }
        try{localStorage.setItem(CACHE_KEY,source)}catch(e){}
        renderCore(source);
      })
      .catch(function(err){
        console.error(err);
        var cached='';
        try{cached=localStorage.getItem(CACHE_KEY)||''}catch(e){}
        if(cached){
          renderCore(cached);
          return;
        }
        boot.className='error';
        boot.innerHTML='本番版の読み込みに失敗しました。<br>インターネット接続を確認して再読み込みしてください。';
      });
  }

  load();
})();
</script>

<!--
変更履歴
- 2026/08/31 本番版：長距離で客先選択時に出勤・退勤時間が自動入力されても「時間未入力」扱いになる不具合を修正
- 長距離は出勤・退勤の両方が自動入力済みなら「時間」は入力済みとして判定
- 残業時間が未確定の場合は「時間未入力」ではなく「残業時間未入力」として管理
- 客先選択直後に入力進捗と入力サマリーを再描画
- 2026/08/31 本番版：仕事内容メモのボタン構成と並び順を整理
- 「塩素」「搭載」の単独ボタンを削除
- 「エステル」を「エステル搭載」へ変更
- 「塩素搭載のみ」を「塩素搭載」へ変更
- 「環境整備（雑用）」を「環境整備」へ変更
- 並び順を「ガス / エステル搭載 / 塩素搭載 / 塩素搭載＋配送 / 環境整備 / PM搭載 / カネカ / 客先」に変更
- 既存の仕事内容メモ・自動処理・残業・集計・バックアップ等の機能は維持
- 2026/08/31 本番版：残業時間欄に「会社の時間外早見表を見る」ボタンを追加
- 本番版の早見表表示を、画像表示からテスト版と同じ見やすい表形式へ変更
- 4:30〜6:00、7:00〜8:00、9:00〜10:00、12:00〜13:00の4区分を表示
- 表はスマホで横スクロール対応
- 定時後4時間を超えた30分休憩帯を黄色で表示
- 既存本番版 v7（commit b2eb76256771bccbcc973e070cd853c9883755c3）を固定基準として読み込み
- 日報、残業、自動計算、長距離、休日、代休、有給、距離手当、毒手当、トレーラー、集計、バックアップ等の既存機能を維持
-->
</body>
</html>
