  function injectReferenceUI(d){
    if(!d || d.getElementById('overtimeReferenceBtn')) return;

    var style=d.createElement('style');
    style.textContent=
      '.ot-ref-btn{width:100%;background:rgba(52,152,219,.12);border:1.5px solid var(--blue);border-radius:10px;padding:11px 12px;color:var(--blue);font-size:14px;font-weight:700;cursor:pointer;margin-top:8px}'+
      '.ot-ref-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:2000;align-items:flex-end;justify-content:center}'+
      '.ot-ref-overlay.open{display:flex}'+
      '.ot-ref-modal{background:var(--surface);width:100%;height:95vh;border-radius:18px 18px 0 0;overflow:hidden;display:flex;flex-direction:column;border-top:2px solid var(--blue)}'+
      '.ot-ref-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border-bottom:1px solid var(--border);flex:none}'+
      '.ot-ref-title{font-size:15px;font-weight:700;color:var(--blue)}'+
      '.ot-ref-close{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:8px 12px;color:var(--text);font-size:14px;cursor:pointer}'+
      '.ot-ref-body{overflow:auto;-webkit-overflow-scrolling:touch;padding:12px}'+
      '.ot-ref-note{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:10px}'+
      '.ot-ref-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px;margin-bottom:14px;overflow:auto}'+
      '.ot-ref-label{font-size:12px;font-weight:700;margin:2px 2px 8px;color:var(--text)}'+
      '.ot-ref-img{display:block;width:auto;max-width:none;height:auto;min-width:900px;transform-origin:top left}'+
      '@media (max-width:600px){.ot-ref-img{min-width:920px}}';
    d.head.appendChild(style);

    var otCard=d.querySelector('.time-card-ot');
    if(!otCard) return;

    var btn=d.createElement('button');
    btn.type='button';
    btn.id='overtimeReferenceBtn';
    btn.className='ot-ref-btn';
    btn.textContent='📋 会社の時間外早見表を見る';

    var note=d.getElementById('overtimeModeNote');
    otCard.insertBefore(btn,note || null);

    var overlay=d.createElement('div');
    overlay.id='overtimeReferenceOverlay';
    overlay.className='ot-ref-overlay';
    overlay.innerHTML=
      '<div class="ot-ref-modal" onclick="event.stopPropagation()">'+
        '<div class="ot-ref-head">'+
          '<div class="ot-ref-title">📋 会社公式 時間外早見表</div>'+
          '<button type="button" class="ot-ref-close" id="overtimeReferenceClose">✕ 閉じる</button>'+
        '</div>'+
        '<div class="ot-ref-body">'+
          '<div class="ot-ref-note">横にスクロールして原本を確認できます。残業計算そのものは従来の自動計算を維持しています。</div>'+
          '<div class="ot-ref-card">'+
            '<div class="ot-ref-label">4:30〜8:00 出勤</div>'+
            '<img class="ot-ref-img" alt="4:30〜8:00出勤の時間外早見表">'+
          '</div>'+
          '<div class="ot-ref-card">'+
            '<div class="ot-ref-label">9:00〜13:00 出勤</div>'+
            '<img class="ot-ref-img" alt="9:00〜13:00出勤の時間外早見表">'+
          '</div>'+
        '</div>'+
      '</div>';

    d.body.appendChild(overlay);

    var imgs=overlay.querySelectorAll('.ot-ref-img');
    imgs[0].src=REF_IMG_1;
    imgs[1].src=REF_IMG_2;

    function openRef(){
      overlay.classList.add('open');
      d.body.style.overflow='hidden';
    }
    function closeRef(){
      overlay.classList.remove('open');
      d.body.style.overflow='';
    }

    btn.addEventListener('click',openRef);
    d.getElementById('overtimeReferenceClose').addEventListener('click',closeRef);
    overlay.addEventListener('click',function(e){
      if(e.target===overlay) closeRef();
    });
  }

  function renderCore(source){
    if(!source || source.indexOf('<!DOCTYPE html>')===-1 || source.indexOf('</html>')===-1){
      throw new Error('本番コードが不完全です');
    }

    frame.onload=function(){
      try{
        injectReferenceUI(frame.contentDocument);
        boot.style.display='none';
      }catch(e){
        console.error(e);
        boot.className='error';
        boot.textContent='本番画面の追加表示に失敗しました。再読み込みしてください。';
      }
    };

    frame.srcdoc=source;
  }

  function load(){
    fetch(CORE_URL,{cache:'no-store'})
      .then(function(res){
        if(!res.ok) throw new Error('HTTP '+res.status);
        return res.text();
      })
      .then(function(source){
        if(source.indexOf('<!DOCTYPE html>')===-1 || source.indexOf('</html>')===-1){
          throw new Error('取得したindex.htmlが不完全です');
        }
        try{ localStorage.setItem(CACHE_KEY,source); }catch(e){}
        renderCore(source);
      })
      .catch(function(err){
        console.error(err);
        var cached='';
        try{ cached=localStorage.getItem(CACHE_KEY)||''; }catch(e){}
        if(cached){
          renderCore(cached);
          return;
        }
        boot.className='error';
        boot.innerHTML='本番版の読み込みに失敗しました。<br>インターネット接続を確認して再読み込みしてください。';
      });
  }

  load();
})();
</script>
